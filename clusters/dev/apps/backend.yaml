apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jetstay-backend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/feniksxshi/jetstay-gitops.git
    targetRevision: main
    path: apps/backend/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: jetstay
  syncPolicy:
    automated:
      prune: true
      selfHeal: true