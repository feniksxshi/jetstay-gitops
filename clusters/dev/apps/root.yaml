apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jetstay-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<your-github-username>/jetstay-gitops.git
    targetRevision: main
    path: clusters/dev/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true