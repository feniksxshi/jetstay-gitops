apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" #Runs First!
spec: 
  project: default
  source:
    repoURL: https://github.io
    chart: prometheus-operator-crds
    targetRevision: 17.0.2 # Use a version matching your stack
  destination:
    server: https://default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true