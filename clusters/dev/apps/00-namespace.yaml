apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jetstay-namespace
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/feniksxshi/jetstay-gitops.git
    targetRevision: main
    path: clusters/dev/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: jetstay
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true